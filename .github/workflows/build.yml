name: build-and-deploy

# 週1（日 JST5時 = UTC 日曜20時）＋手動＋main push。ホテルは低頻度更新で十分。
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

# 最小権限。Secrets・書き込みトークンは使わない（公開API読取とPages配信のみ）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 取得崩れ時は build_hotels.py が非0終了 → 次の段で前回配信した一覧を配り直す
      # （以前は配信ジョブごと止めていたが、それだとトイレなど他の一覧も道連れで止まった・2026-10-29）
      - id: hotels
        run: python build_hotels.py
        continue-on-error: true
      - name: ホテルが取れなかった時は前回の配信を配り直す
        if: steps.hotels.outcome != 'success'
        run: |
          mkdir -p out
          curl -fsSL https://taxilog-app.github.io/route_poi_feed/hotels_jp.json -o out/hotels_jp.json
          python -c "import json;d=json.load(open('out/hotels_jp.json'));assert len(d['hotels'])>=50"
      # トイレとコンビニ（営業圏ごと・2026-10-29）。営業圏の形は route_boundary_feed の配信から
      - run: python build_toilets.py fukuoka
        # 取れない時は前回の一覧を配り直す。それも無い（初回）時に失敗しても、ホテルの配信は止めない
        continue-on-error: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
