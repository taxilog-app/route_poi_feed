name: build-and-deploy

# 週1（日 JST5時 = UTC 日曜20時）＋手動＋main push。ホテルは低頻度更新で十分。
on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

# 最小権限。Secrets・書き込みトークンは使わない（公開API読取とPages配信のみ）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 取得崩れ時は build_hotels.py が非0終了 → 配信ジョブに進まず前回分を温存
      - run: python build_hotels.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
